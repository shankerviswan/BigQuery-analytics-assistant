# Approved business metrics (versioned by hand).
# thelook_ecommerce examples are REFERENCE ONLY — swap definitions for your domain.
# Structured fields (agg, column, filters, time_column) drive AST alignment checks.
version: "1"
metrics:
  order_count:
    description: Count of orders created during the requested period.
    aliases: ["number of orders", "order volume", "orders"]
    grain: one row per orders.order_id
    time_column: created_at
    time_table: bigquery-public-data.thelook_ecommerce.orders
    agg: count_distinct
    column: order_id
    filters: []
    tables:
      - bigquery-public-data.thelook_ecommerce.orders
    sql_rule: "COUNT(DISTINCT o.order_id)"
    caveats:
      - "REFERENCE metric on public sample data."
      - "Counts all order statuses unless a status filter is explicitly requested."

  cancelled_order_count:
    description: Count of orders whose status is Cancelled, created during the requested period.
    aliases: ["cancelled orders", "canceled orders", "cancellation count"]
    grain: one row per orders.order_id
    time_column: created_at
    time_table: bigquery-public-data.thelook_ecommerce.orders
    agg: count_distinct
    column: order_id
    filters:
      - column: status
        op: eq
        value: cancelled
        case_insensitive: true
    tables:
      - bigquery-public-data.thelook_ecommerce.orders
    sql_rule: "COUNT(DISTINCT o.order_id) WHERE LOWER(o.status) = 'cancelled'"
    caveats:
      - "REFERENCE metric on public sample data."
      - "Verify live status values before production use."

  item_sales_value:
    description: Sum of order-item sale_price excluding Cancelled and Returned items.
    aliases: ["item sales value", "sales from order items"]
    grain: one row per order_items.id
    time_column: created_at
    time_table: bigquery-public-data.thelook_ecommerce.order_items
    agg: sum
    column: sale_price
    filters:
      - column: status
        op: not_in
        value: [cancelled, returned]
        case_insensitive: true
    tables:
      - bigquery-public-data.thelook_ecommerce.order_items
    sql_rule: "SUM(oi.sale_price) with status not in (cancelled, returned)"
    caveats:
      - "REFERENCE proxy, not authoritative net revenue."
      - "Ask for clarification when the user only says sales or revenue."

  category_item_sales:
    description: Sum of eligible order-item sale_price grouped by product category.
    aliases: ["sales by category", "category sales", "category revenue"]
    grain: one row per product category
    time_column: created_at
    time_table: bigquery-public-data.thelook_ecommerce.order_items
    agg: sum
    column: sale_price
    group_by: [category]
    filters:
      - column: status
        op: not_in
        value: [cancelled, returned]
        case_insensitive: true
    tables:
      - bigquery-public-data.thelook_ecommerce.order_items
      - bigquery-public-data.thelook_ecommerce.products
    sql_rule: "SUM(oi.sale_price) grouped by p.category; exclude cancelled/returned"
    caveats:
      - "REFERENCE proxy. Join must use oi.product_id = p.id."
