# Golden / must_reject cases for the grounded assistant.
# Offline cases use StubProvider; live cases are marked with needs_bq: true.
version: 1
cases:
  - id: sales_ambiguous
    question: "What were sales last month?"
    as_of: "2026-10-14"
    must_status: clarification_required

  - id: january_2024_not_2025
    question: "How many orders were created in January 2024?"
    as_of: "2026-10-14"
    expect_time_range: january_2024
    expect_order_count: 1409
    expect_start: "2024-01-01T00:00:00-08:00"
    expect_end: "2024-02-01T00:00:00-08:00"
    timezone: America/Los_Angeles
    live_job_id: "62faf47c-6e8b-4493-8e85-efa3501d7e45"
    live_bytes_processed: 2009344
    live_bytes_billed: 10485760
    notes: >
      Verified 2026-10-14 on project bigquery-assistance against public
      thelook orders. DemoProvider, no LLM. bytes_billed is BigQuery's
      10 MiB minimum. Offline tests replay this count and do not re-query.

  - id: january_2024_cancelled
    question: "cancelled-order count for January 2024?"
    as_of: "2026-10-14"
    expect_metric: cancelled_order_count
    expect_order_count: 212
    expect_time_range: january_2024
    expect_start: "2024-01-01T00:00:00-08:00"
    expect_end: "2024-02-01T00:00:00-08:00"
    timezone: America/Los_Angeles
    live_job_id: "8e03c28d-b7d7-4353-978f-3e1daaf18182"
    live_bytes_processed: 3296426
    live_bytes_billed: 10485760
    notes: >
      Verified 2026-10-14 with deepseek-flash (thinking disabled) on project
      bigquery-assistance. SQL used LOWER(status) = 'cancelled' and the same
      half-open January bounds. 212 is the cancelled subset of the 1409 orders.
      Offline tests replay this count and do not re-query.

  - id: cte_bypass_users
    question: "(policy) CTE hide users table"
    must_reject_sql: |
      WITH users AS (
        SELECT order_id FROM `bigquery-public-data.thelook_ecommerce.orders`
      )
      SELECT * FROM `bigquery-public-data.thelook_ecommerce.users`
    notes: "P0 validator bypass"

  - id: wrong_cancelled_filter
    must_reject_sql: |
      SELECT COUNT(DISTINCT o.order_id) AS cancelled_order_count
      FROM `bigquery-public-data.thelook_ecommerce.orders` AS o
      WHERE o.status != 'cancelled'
        AND o.created_at >= @start_date AND o.created_at < @end_date
    expect_metric: cancelled_order_count

  - id: hardcoded_dates
    must_reject_sql: |
      SELECT COUNT(DISTINCT o.order_id) AS order_count
      FROM `bigquery-public-data.thelook_ecommerce.orders` AS o
      WHERE o.created_at >= '2019-01-01' AND o.created_at < '2019-02-01'
    expect_metric: order_count
